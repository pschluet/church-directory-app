# Local Postgres for development. The deployed database is RDS Postgres in a
# private subnet; this container exists so the app can be run entirely offline.
services:
  postgres:
    image: postgres:17-alpine
    container_name: church-directory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: directory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d directory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
