name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # The API tests run against a real Postgres rather than a fake query layer:
    # the inheritance resolution view and the special-date CHECK constraints
    # carry a lot of this app's logic, and a fake would cover none of it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: directory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & format check
        run: npm run ci:check

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Test
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres

      - name: Build the SPA
        # Catches anything that typechecks but will not bundle.
        run: npm run build:app
